<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Finder</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--accent:#c2410c;--good:#15803d;--bad:#b91c1c;--warn:#b45309;--chip:#f0eee9}
@media (prefers-color-scheme:dark){:root{--bg:#131314;--card:#1d1d20;--ink:#ececee;--mute:#9a9aa1;--line:#2e2e33;--accent:#fb923c;--good:#4ade80;--bad:#f87171;--warn:#fbbf24;--chip:#28282c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:18px;margin:0;letter-spacing:-.01em}h1 span{color:var(--accent)}
.meta{color:var(--mute);font-size:13px}.sp{flex:1}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--mute)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:wait}
nav{display:flex;gap:4px;padding:0 24px;border-bottom:1px solid var(--line)}
nav a{padding:10px 12px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent;cursor:pointer}nav a.on{color:var(--ink);border-color:var(--accent)}
main{padding:20px 24px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.rank{font-weight:700;font-size:20px}
.chip{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:12px;font-variant-numeric:tabular-nums}
.b-review{color:var(--warn);border:1px solid var(--warn);background:none}.b-high{color:var(--bad);border:1px solid var(--bad);background:none}
.lbl{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-top:10px}
.q{margin:2px 0}.why{color:var(--mute);font-size:13px;margin-top:8px}
.scores{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--mute)}.scores b{color:var(--ink)}
.acts{display:flex;gap:6px;margin-top:12px;align-items:center}.acts .s{margin-left:auto;font-size:12px;color:var(--mute)}
button.acc.on{background:var(--good);border-color:var(--good);color:#fff}button.rej.on{background:var(--bad);border-color:var(--bad);color:#fff}
pre{white-space:pre-wrap;font-size:12px;background:var(--chip);border-radius:8px;padding:10px;max-height:260px;overflow:auto;margin:8px 0 0}
table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:500}
h2{font-size:16px;margin:22px 0 8px}h2:first-child{margin-top:0}.note{color:var(--mute);font-size:13px;margin:4px 0 12px}
.wave li{margin:6px 0}.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;display:none}
@media (max-width:600px){header,nav,main{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Promo <span>Finder</span></h1>
  <div class="meta" id="meta">loading…</div>
  <div class="sp"></div>
  <button id="runOff" title="Offline judge, no API calls">Run (offline)</button>
  <button id="runLlm" title="LLM judge, cached; uses free-tier requests on a new script">Run with LLM judge</button>
  <button id="evalBtn">Evaluate</button>
</header>
<nav id="tabs"><a data-t="promos" class="on">Promos</a><a data-t="plan">Posting plan</a><a data-t="eval">Evaluation</a><a data-t="learn">Learning loop</a></nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
let S=null, tab="promos";
const $=s=>document.querySelector(s), esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",3500)};
async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
async function load(){try{S=await api("/api/state");const m=S.manifest,st=m.judge_stats||{};
 $("#meta").textContent=`${S.out} · model ${m.model} · judge ${m.judge} · ${S.promos.length} promos · pool ${st.pool??"?"} · ${st.calls??0} judge calls (${st.cache_hits??0} cached) · ${st.seconds??"?"}s`;}
 catch(e){$("#meta").textContent=e.message;S=null}render()}
function segs(p){return p.segments.map(s=>`<span class="chip">Ep${s.episode} ${esc(s.timecode)}</span>`).join(" + ")}
function promoCard(p){const fb=S.feedback[p.id];const pol=p.policy?.label;const sc=p.scores||{};
 return `<div class="card" id="p${p.rank}"><div class="top"><span class="rank">#${p.rank}</span>${segs(p)}<span class="chip">${p.duration}s</span><span class="chip">${esc(p.hook_type)}</span>
 ${pol==="review"?`<span class="chip b-review" title="${esc((p.policy.reasons||[]).join('; '))}">ad-policy review</span>`:""}${p.spoiler==="high"?`<span class="chip b-high">spoiler</span>`:""}</div>
 <div class="lbl">Opens on</div><div class="q">${esc(p.hook)}</div><div class="lbl">Ends on</div><div class="q">${esc(p.cliffhanger)}</div>
 <div class="why">${esc(p.why)}</div>
 ${sc.hook!==undefined?`<div class="scores">LLM judge: hook <b>${sc.hook}</b> · cliffhanger <b>${sc.cliffhanger}</b> · standalone <b>${sc.standalone}</b> · emotion <b>${sc.emotion}</b>${p.pairwise_wins!==undefined?` · pairwise wins <b>${p.pairwise_wins}</b>`:""}</div>`:""}
 <div class="acts"><button class="acc ${fb===1?"on":""}" onclick="fb('${p.id}','accept')">Accept</button><button class="rej ${fb===0?"on":""}" onclick="fb('${p.id}','reject')">Reject</button>
 <button onclick="this.closest('.card').querySelector('pre').hidden^=1">Script</button><span class="s">${esc(p.judge)}</span></div>
 <pre hidden>${esc((p.script||[]).join("\n"))}</pre></div>`}
function render(){document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));const M=$("#main");
 if(!S){M.innerHTML=`<p class="note">No run loaded. Press Run.</p>`;return}
 if(tab==="promos") M.innerHTML=`<p class="note">Ranked promos. Every cut starts and ends on a real line of the script; edit points add 0.4 s handles. Accept/Reject feeds the learning loop (demo log only).</p><div class="grid">${S.promos.map(promoCard).join("")}</div>`;
 if(tab==="plan") M.innerHTML=S.waves.map(w=>`<h2>${esc(w.title)}</h2><p class="note">${esc(w.why)}</p><ol class="wave">${w.items.map(r=>{const p=S.promos.find(x=>x.rank===r);return `<li><a href="#p${r}" onclick="tab='promos';render();setTimeout(()=>document.getElementById('p${r}').scrollIntoView({behavior:'smooth'}),50)">#${r}</a> ${segs(p)} <span class="chip">${esc(p.hook_type)}</span> ${esc(p.hook)}</li>`}).join("")||"<li class='note'>none</li>"}</ol>`).join("");
 if(tab==="eval") M.innerHTML=evalView();
 if(tab==="learn") M.innerHTML=`<h2>Learning loop</h2><p class="note">${Object.keys(S.feedback).length} demo labels from the Promos tab. Retrain fits a challenger on them (episode-blocked CV picks the regularisation), then the gate compares it to the champion on held-out validation gold with a bootstrap interval. The demo never saves or promotes.</p>
 <button class="primary" onclick="retrain(this)">Retrain from my labels</button><div id="rt"></div>`}
function evalView(){const E=S.eval;if(!E)return `<p class="note">No evaluation yet. Press Evaluate.</p>`;
 const keys=["precision@10","bad_rate@10","must_recall@10","ndcg@10"];
 let h=`<h2>Held-out episodes ${E.split}–50 · validation gold · judge ${esc(E.judge)}</h2><p class="note">Unlabelled picks are unknown, not wrong: see the buckets column.</p><table><tr><th>system</th>${keys.map(k=>`<th>${k}</th>`).join("")}<th>top-10 good / bad / unlabelled</th></tr>`;
 for(const [n,r] of Object.entries(E.systems)) h+=`<tr><td>${esc(n)}</td>${keys.map(k=>`<td>${r.heldout_block[k]??"–"}</td>`).join("")}<td>${esc(r.heldout_top10_buckets)}</td></tr>`;
 h+=`</table><h2>Rubric checks on the model's held-out top 10</h2><table><tr><th>system</th><th>check</th></tr>`;
 for(const [n,r] of Object.entries(E.systems)) if(r["rubric_checks@10"]) h+=`<tr><td>${esc(n)}</td><td>${esc(JSON.stringify(r["rubric_checks@10"]))}</td></tr>`;
 h+=`</table><h2>Where it picks badly</h2><p class="note">Top picks that hit a region labelled bad, and must-haves it missed.</p><table><tr><th>type</th><th>detail</th></tr>`;
 for(const f of E.failures_heldout||[]) h+=`<tr><td>bad pick #${f.rank}</td><td>${esc(f.gold_note)} — ${esc(f.hook)}</td></tr>`;
 for(const m of E.missed_musts_heldout||[]) h+=`<tr><td>missed must</td><td>${esc(m.note)} (${esc(m.why_missed)})</td></tr>`;
 return h+`</table><h2>Cost</h2><pre>${esc(JSON.stringify(E.cost||{},null,1))}</pre>`}
async function fb(id,d){try{const r=await api("/api/feedback",{id,decision:d});S.feedback[id]=d==="accept"?1:0;render();toast(`${d}ed · ${r.labels} demo labels`)}catch(e){toast(e.message)}}
async function retrain(b){b.disabled=true;$("#rt").innerHTML=`<p class="note">training…</p>`;try{const r=await api("/api/retrain",{});
 $("#rt").innerHTML=r.promote===undefined?`<p class="note">${esc(r.note)}</p>`:`<h2>${r.promote?"Gate: would promote":"Gate: held back"}</h2><p>${esc(r.reason)}</p><p class="note">${esc(r.note)}</p>
 <table><tr><th></th><th>NDCG@10</th><th>precision@10</th><th>bad-rate@10</th></tr><tr><td>champion</td><td>${r.champion["ndcg@10"]}</td><td>${r.champion["precision@10"]}</td><td>${r.champion["bad_rate@10"]}</td></tr><tr><td>challenger</td><td>${r.challenger["ndcg@10"]}</td><td>${r.challenger["precision@10"]}</td><td>${r.challenger["bad_rate@10"]}</td></tr></table>
 <h2>Largest weight shifts</h2><pre>${esc(r.shifts.map(s=>s[0]+": "+(s[1]>0?"+":"")+s[1]).join("\n"))}</pre>`}catch(e){$("#rt").innerHTML=`<p class="note">${esc(e.message)}</p>`}b.disabled=false}
async function run(offline){const bs=[$("#runOff"),$("#runLlm"),$("#evalBtn")];bs.forEach(b=>b.disabled=true);toast(offline?"running offline…":"running with LLM judge (cached clips are free)…");
 try{await api("/api/run",{offline,out:offline?"runs/r1":"runs/live"});await load();toast("run complete")}catch(e){toast(e.message)}bs.forEach(b=>b.disabled=false)}
$("#runOff").onclick=()=>run(true);$("#runLlm").onclick=()=>run(false);
$("#evalBtn").onclick=async()=>{$("#evalBtn").disabled=true;toast("evaluating…");try{await api("/api/eval",{});await load();tab="eval";render()}catch(e){toast(e.message)}$("#evalBtn").disabled=false};
document.querySelectorAll("#tabs a").forEach(a=>a.onclick=()=>{tab=a.dataset.t;render()});
load();
</script>
</body>
</html>
