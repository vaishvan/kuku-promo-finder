<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Promo Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Design tokens: Figma profile (getdesign.md/figma) - black/white canvas, pill buttons, pastel color blocks */
:root{--ink:#000;--canvas:#fff;--soft:#f7f7f5;--hair:#e6e6e6;--hair2:#f1f1f1;--mute:#5c5c5c;--magenta:#ff3d8b;
 --lime:#dceeb1;--lilac:#c5b0f4;--cream:#f4ecd6;--mint:#c8e6cd;--pink:#efd4d4;--coral:#f3c9b6;--navy:#1f1d3d;--ok:#1ea64a;--warn:#b45309;--bad:#c81e1e;
 --sans:"Inter Variable",Inter,"figmaSans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono","figmaMono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#fff;--canvas:#000;--soft:#141414;--hair:#2a2a2a;--hair2:#1c1c1c;--mute:#a3a3a3}}
:root[data-theme="dark"]{--ink:#fff;--canvas:#000;--soft:#141414;--hair:#2a2a2a;--hair2:#1c1c1c;--mute:#a3a3a3}
*{box-sizing:border-box}html{background:var(--canvas)}
body{margin:0;background:var(--canvas);color:var(--ink);font:400 16px/1.45 var(--sans);letter-spacing:-.14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
header{border-bottom:1px solid var(--hair);background:var(--canvas);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-weight:700;font-size:20px;letter-spacing:-.4px}.logo i{font-style:normal;color:var(--magenta)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.sp{flex:1}
.pill{font:500 15px/1 var(--sans);letter-spacing:-.1px;border-radius:50px;padding:13px 22px;min-height:44px;border:1px solid var(--ink);background:var(--ink);color:var(--canvas);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.pill.sec{background:var(--canvas);color:var(--ink);border-color:var(--hair)}.pill.sec:hover{border-color:var(--ink)}
.pill.mag{background:var(--magenta);border-color:var(--magenta);color:#fff}
.pill.sm{padding:8px 14px;min-height:34px;font-size:13px}
.pill:disabled{opacity:.45;cursor:not-allowed}
.status{font:500 12px/1 var(--mono);letter-spacing:.4px;border:1px solid var(--hair);border-radius:50px;padding:9px 12px;color:var(--mute);white-space:nowrap}
.block{border-radius:24px;padding:48px;margin:24px 0;color:#000}
.block h2,.block h3{color:#000}
.lilac{background:var(--lilac)}.cream{background:var(--cream)}.lime{background:var(--lime)}.mint{background:var(--mint)}.pink{background:var(--pink)}.coral{background:var(--coral)}
.navy{background:var(--navy);color:#fff}.navy h2,.navy h3{color:#fff}
h1.display{font-size:64px;line-height:1.05;font-weight:540;letter-spacing:-.96px;margin:12px 0 12px;max-width:16ch}
.sub{font-size:20px;line-height:1.4;font-weight:330;max-width:52ch;margin:0 0 28px}
h2{font-size:26px;line-height:1.35;font-weight:600;letter-spacing:-.26px;margin:0 0 8px}
h3{font-size:20px;font-weight:600;margin:0 0 6px}
.drop{background:#fff;color:#000;border-radius:24px;padding:28px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border:2px dashed transparent;transition:border-color .15s}
.drop.over{border-color:#000}
.drop .ic{width:56px;height:56px;border-radius:9999px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none;background:#f7f7f5}
.drop .t{flex:1;min-width:220px}.drop .t b{font-size:18px}.drop .t div{color:#5c5c5c;font-size:14px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font:500 12px/1 var(--mono);letter-spacing:.3px;background:rgba(0,0,0,.06);color:inherit;border-radius:50px;padding:6px 10px;white-space:nowrap}
.card .chip{background:var(--soft)}
.steps{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.steps li{background:rgba(255,255,255,.6);border-radius:16px;padding:14px 14px 12px;font-size:14px}
.steps li .n{font:500 12px/1 var(--mono);color:#5c5c5c;letter-spacing:.5px}
.steps li.on{background:#fff;outline:2px solid #000}.steps li.ok{background:#fff}.steps li.ok .n::after{content:" ✓";color:var(--ok)}
.bar{height:8px;border-radius:9999px;background:rgba(0,0,0,.1);overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:#000;width:0;transition:width .3s}
.log{font:500 12px/1.6 var(--mono);background:rgba(255,255,255,.7);border-radius:16px;padding:14px;margin-top:14px;max-height:150px;overflow:auto;white-space:pre-wrap}
.tabs{display:flex;gap:6px;margin:32px 0 8px;flex-wrap:wrap}
.tabs button{font:500 15px/1 var(--sans);border-radius:50px;padding:12px 18px;border:1px solid var(--hair);background:var(--canvas);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;margin:16px 0 48px}
.card{border:1px solid var(--hair);border-radius:24px;padding:24px;background:var(--canvas)}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rank{font-size:40px;font-weight:540;letter-spacing:-.8px;line-height:1;margin-right:6px}
.flag-r{border:1px solid var(--warn);color:var(--warn);background:none!important}.flag-s{border:1px solid var(--bad);color:var(--bad);background:none!important}
.lbl{font:500 12px/1 var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:16px 0 4px}
.q{font-size:18px;line-height:1.4;font-weight:400;letter-spacing:-.26px}
.why{margin-top:14px;font-size:15px;color:var(--mute)}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.scores div{font:500 11px/1 var(--mono);color:var(--mute);letter-spacing:.4px}.scores b{display:block;font:600 22px/1.2 var(--sans);color:var(--ink);letter-spacing:-.3px;margin-top:4px}
.row{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}.row .s{margin-left:auto;font:500 11px/1 var(--mono);color:var(--mute)}
.pill.acc.on{background:var(--ok);border-color:var(--ok);color:#fff}.pill.rej.on{background:var(--bad);border-color:var(--bad);color:#fff}
pre{white-space:pre-wrap;font:500 12px/1.6 var(--mono);background:var(--soft);border-radius:16px;padding:14px;max-height:280px;overflow:auto;margin:14px 0 0}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--canvas);color:var(--ink);border:1px solid var(--hair);border-radius:16px;overflow:hidden}
th,td{padding:12px 14px;border-bottom:1px solid var(--hair2);text-align:left;font-variant-numeric:tabular-nums;vertical-align:top}
th{font:500 11px/1.2 var(--mono);letter-spacing:.5px;text-transform:uppercase;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-top:20px}
.kpis div{font:500 12px/1.3 var(--mono);letter-spacing:.5px;text-transform:uppercase;opacity:.75}.kpis b{display:block;font:540 44px/1.1 var(--sans);letter-spacing:-.9px;text-transform:none;opacity:1;margin-top:6px}
.block table{background:rgba(255,255,255,.75);color:#000;border-color:rgba(0,0,0,.08)}
.block th{color:rgba(0,0,0,.55)}.block td{border-color:rgba(0,0,0,.06)}
.learned{background:rgba(255,255,255,.75);color:#000;border-radius:16px;padding:16px 20px;margin-top:16px}
.learned li{margin:4px 0}.verdict{font-size:20px;margin:6px 0 4px}
.note{color:var(--mute);font-size:15px;margin:4px 0 16px}.block .note{color:rgba(0,0,0,.65)}.navy .note{color:rgba(255,255,255,.7)}
.wave ol{margin:12px 0 0;padding-left:20px}.wave li{margin:8px 0}.wave a{color:#000;font-weight:600}
.empty{padding:40px 0;color:var(--mute)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:12px 18px;border-radius:50px;font-size:14px;display:none;z-index:9}
@media (max-width:768px){.wrap{padding:0 16px}.block{border-radius:0;margin:16px -16px;padding:32px 16px}h1.display{font-size:44px}.grid{grid-template-columns:1fr}.pill{width:100%;justify-content:center}.actions .pill{width:100%}.status{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">Promo <i>Finder</i></div>
  <div class="sp"></div>
</div></header>

<div class="wrap">
  <section class="block lilac">
    <h1 class="display">Find the promos hiding in a microdrama.</h1>
    <p class="sub">Drop the scripts zip. Every 20–60 second cut is scored, and the best go to an LLM judge.</p>
    <label class="drop" id="drop">
      <span class="ic">↥</span>
      <span class="t"><b id="dropTitle">Drop the scripts .zip here</b><div id="dropSub">or click to choose a file</div></span>
      <span class="pill sec">Choose zip</span>
      <input type="file" id="file" accept=".zip" hidden>
    </label>
    <div class="files" id="files"></div>
    <div class="actions">
      <button class="pill mag" id="runLlm" disabled>Run with LLM judge</button>
      <button class="pill sec" id="runOff" disabled>Run offline (no API)</button>
    </div>
  </section>

  <section class="block cream" id="progress" hidden>
    <h2 id="stepTitle">Waiting to start</h2>
    <div id="errBox" hidden><p id="errMsg" style="font-size:18px;margin:8px 0 16px"></p><div class="actions" style="margin-top:0" id="errActions"></div></div>
    <ul class="steps" id="steps"></ul>
    <div class="bar"><i id="barFill"></i></div>
    <div class="log" id="log"></div>
  </section>

  <div id="results" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="main"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let S=null, tab="review", J={}, poll=null;
const $=s=>document.querySelector(s), esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",4000)};
async function api(path,body,raw){const opt=body===undefined?{}:{method:"POST",headers:raw?{"X-Filename":raw}:{"Content-Type":"application/json"},body:raw?body:JSON.stringify(body)};
 let r;try{r=await fetch(path,opt)}catch(e){throw new Error("Can't reach the demo server. Is it still running?")}
 let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||`Request failed (${r.status}).`);return j}

async function budget(){try{const b=await api("/api/budget");$("#runLlm").dataset.ok=b.llm_available?"1":"";
 $("#runLlm").title=b.llm_available?"":"No LLM key in .env";if(!b.llm_available)$("#runLlm").disabled=true}catch(e){}}

async function upload(file){if(!file)return;if(!/\.zip$/i.test(file.name)){toast("please choose a .zip");return}
 $("#dropTitle").textContent=`Uploading ${file.name}…`;
 try{const r=await api("/api/upload",file,file.name);
  $("#dropTitle").textContent=`${file.name} · ${r.files.length} scripts extracted`;
  $("#dropSub").textContent=r.skipped.length?`${r.skipped.length} non-script files ignored`:"ready to run";
  $("#files").innerHTML=r.files.slice(0,8).map(f=>`<span class="chip">${esc(f)}</span>`).join("")+(r.files.length>8?`<span class="chip">+${r.files.length-8} more</span>`:"");
  $("#runLlm").disabled=!$("#runLlm").dataset.ok;$("#runOff").disabled=false;showProgress();await refreshJob()}
 catch(e){$("#dropTitle").textContent="Drop the scripts .zip here";$("#dropSub").textContent=e.message;toast(e.message)}}

const STEPS=[["Upload",j=>!!j.upload],["Extract",j=>j.log?.some(l=>l.includes("extracted"))],["Parse",j=>j.log?.some(l=>l.includes("parsed"))],
 ["Candidates",j=>j.log?.some(l=>l.includes("stitched"))],["Shortlist",j=>j.log?.some(l=>l.includes("prefilter"))],
 ["LLM judge",j=>j.to_judge>0&&j.judged>=j.to_judge],["Pairwise",j=>j.pairs_total>0?j.pairs>=j.pairs_total:j.status==="done"],["Rank & plan",j=>j.status==="done"]];
function showProgress(){$("#progress").hidden=false}
function renderErr(j){const box=$("#errBox");if(j.status!=="error"){box.hidden=true;return}box.hidden=false;$("#errMsg").textContent=j.error||"The run stopped.";
 const a=[];if(j.fix==="offline")a.push(`<button class="pill" onclick="start(true)">Run offline instead</button>`);
 if(j.fix==="upload")a.push(`<button class="pill" onclick="document.getElementById('file').click()">Choose another zip</button>`);
 a.push(`<button class="pill sec" onclick="start(false)">Try again</button>`);$("#errActions").innerHTML=a.join("")}
function renderJob(){const j=J;if(!j.status||j.status==="idle")return;showProgress();renderErr(j);
 let cur=STEPS.findIndex(([_,f])=>!f(j));if(cur<0)cur=STEPS.length;
 $("#steps").innerHTML=STEPS.map(([n],i)=>`<li class="${i<cur?"ok":i===cur&&j.status==="running"?"on":""}"><div class="n">0${i+1}</div>${n}</li>`).join("");
 $("#stepTitle").textContent=j.status==="error"?"Run stopped":j.status==="done"?"Done":j.step||"Ready to run";
 const pct=j.status==="done"?100:j.to_judge?Math.round(100*(j.judged+(j.pairs||0))/(j.to_judge+(j.pairs_total||0)||1)):Math.min(30,cur*6);
 $("#barFill").style.width=pct+"%";const L=$("#log");L.textContent=(j.log||[]).join("\n");L.scrollTop=L.scrollHeight}
async function refreshJob(){J=await api("/api/job");renderJob();return J}
async function start(offline){["#runLlm","#runOff"].forEach(s=>$(s).disabled=true);
 try{await api("/api/start",{offline,k:25});showProgress();$("#progress").scrollIntoView({behavior:"smooth"});
  clearInterval(poll);poll=setInterval(async()=>{const j=await refreshJob();if(j.status!=="running"){clearInterval(poll);
   if(j.status==="done"){await load();budget();$("#results").scrollIntoView({behavior:"smooth"})}
   $("#runOff").disabled=false;$("#runLlm").disabled=!$("#runLlm").dataset.ok}},1000)}
 catch(e){toast(e.message);$("#runOff").disabled=false;$("#runLlm").disabled=!$("#runLlm").dataset.ok}}

async function load(){try{S=await api("/api/state")}catch(e){S=null}$("#results").hidden=!S;render()}
const segs=p=>p.segments.map(s=>`<span class="chip">Ep ${s.episode} · ${esc(s.timecode)}</span>`).join("");
const status=p=>S.feedback[p.id]===1?"accepted":S.feedback[p.id]===0?"rejected":"review";
function card(p){const st=status(p),sc=p.scores||{},pol=p.policy?.label;
 const acts=st==="review"
  ?`<button class="pill sm sec acc" onclick="fb('${p.id}','accept')">Accept</button><button class="pill sm sec rej" onclick="fb('${p.id}','reject')">Reject</button>`
  :`<button class="pill sm sec" onclick="fb('${p.id}','clear')">Undo</button><button class="pill sm sec" onclick="fb('${p.id}','${st==="accepted"?"reject":"accept"}')">Move to ${st==="accepted"?"rejected":"accepted"}</button>`;
 return `<div class="card" id="p${p.rank}"><div class="top"><span class="rank">${p.rank}</span>${segs(p)}<span class="chip">${p.duration}s</span><span class="chip">${esc(p.hook_type)}</span>
 ${pol==="review"?`<span class="chip flag-r" title="${esc((p.policy.reasons||[]).join("; "))}">ad-policy review</span>`:""}${p.spoiler==="high"?`<span class="chip flag-s">spoiler</span>`:""}</div>
 <div class="lbl">Opens on</div><div class="q">${esc(p.hook)}</div><div class="lbl">Ends on</div><div class="q">${esc(p.cliffhanger)}</div>
 <div class="why">${esc(p.why)}</div>
 ${sc.hook!==undefined?`<div class="scores"><div>Hook<b>${sc.hook}</b></div><div>Cliffhanger<b>${sc.cliffhanger}</b></div><div>Standalone<b>${sc.standalone}</b></div><div>Emotion<b>${sc.emotion}</b></div></div>`:""}
 <div class="row">${acts}<button class="pill sm sec" onclick="this.closest('.card').querySelector('pre').hidden^=1">Script</button></div>
 <pre hidden>${esc((p.script||[]).join("\n"))}</pre></div>`}
const TABS=[["review","To review"],["accepted","Accepted"],["rejected","Rejected"],["plan","Posting plan"],["learn","Learning loop"]];
function render(){const M=$("#main");
 if(!S){M.innerHTML=`<p class="empty">No results yet. Upload a scripts zip and run.</p>`;return}
 const n={review:0,accepted:0,rejected:0};S.promos.forEach(p=>n[status(p)]++);
 $("#tabs").innerHTML=TABS.map(([t,l])=>`<button data-t="${t}" class="${t===tab?"on":""}" onclick="tab='${t}';render()">${l}${n[t]!==undefined?` (${n[t]})`:""}</button>`).join("");
 if(["review","accepted","rejected"].includes(tab)){const list=S.promos.filter(p=>status(p)===tab);
  const intro={review:"Accept the clips you'd post, reject the ones you wouldn't. Each choice moves the clip to its own list and teaches the ranker.",
   accepted:"Your shortlist: the clips you'd post. Undo sends a clip back to review.",
   rejected:"Clips you wouldn't post. The ranker learns to push clips like these down."}[tab];
  M.innerHTML=`<p class="note">${intro}</p>`+(list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<p class="empty">${tab==="review"?"All clips reviewed.":"Nothing here yet."}</p>`)}
 if(tab==="plan"){const colors=["lime","mint","cream","pink"];M.innerHTML=S.waves.map((w,i)=>`<section class="block ${colors[i%4]} wave"><h2>${esc(w.title)}</h2><p class="note">${esc(w.why)}</p><ol>${w.items.map(r=>{const p=S.promos.find(x=>x.rank===r);return `<li><a href="#p${r}" onclick="tab=status(S.promos.find(x=>x.rank===${r}));render();setTimeout(()=>document.getElementById('p${r}')?.scrollIntoView({behavior:'smooth'}),60);return false">#${r}</a> ${segs(p)} ${esc(p.hook)}</li>`}).join("")||"<li>none</li>"}</ol></section>`).join("")}
 if(tab==="learn"){const k=n.accepted+n.rejected;M.innerHTML=`<section class="block lime"><h2>Teach the ranker</h2>
  <p class="note">${n.accepted} accepted · ${n.rejected} rejected. ${k<4?`Review at least ${4-k} more clip${4-k===1?"":"s"} to retrain.`:"Retraining is a trial run: nothing is saved."}</p>
  <button class="pill" onclick="retrain(this)" ${k<4?"disabled":""}>Retrain from my choices</button><div id="rt" style="margin-top:20px"></div></section>`}}
async function fb(id,d){try{await api("/api/feedback",{id,decision:d});if(d==="clear")delete S.feedback[id];else S.feedback[id]=d==="accept"?1:0;render()}catch(e){toast(e.message)}}
async function retrain(b){b.disabled=true;$("#rt").innerHTML=`<p class="note">Training…</p>`;try{const r=await api("/api/retrain",{});
 if(r.verdict===undefined){$("#rt").innerHTML=`<p class="note">${esc(r.message||"Couldn't retrain yet.")}</p>`;b.disabled=false;return}
 const row=(l,a,c)=>`<tr><td>${l}</td><td>${a}</td><td>${c}</td></tr>`;
 $("#rt").innerHTML=`<h3>${r.promote?"The new ranker is better":"Keeping the current ranker"}</h3><p class="verdict">${esc(r.verdict)}</p>
 <table><tr><th>On episodes it hasn't seen</th><th>Current ranker</th><th>Retrained</th></tr>
 ${row("Good clips in its top 10",r.before.good,r.after.good)}${row("Known-bad clips in its top 10",r.before.bad,r.after.bad)}</table>
 <div class="learned"><b>What your choices taught it</b><ul>${r.learned.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}
 catch(e){$("#rt").innerHTML=`<p class="note">${esc(e.message)}</p>`}b.disabled=false}

const drop=$("#drop");["dragenter","dragover"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add("over")}));
["dragleave","drop"].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove("over")}));
drop.addEventListener("drop",ev=>upload(ev.dataTransfer.files[0]));$("#file").onchange=e=>upload(e.target.files[0]);
$("#runLlm").onclick=()=>start(false);$("#runOff").onclick=()=>start(true);
budget();load();refreshJob().then(j=>{if(j.status==="running"){showProgress();poll=setInterval(async()=>{const k=await refreshJob();if(k.status!=="running"){clearInterval(poll);load()}},1000)}}).catch(()=>{});
</script>
</body>
</html>
